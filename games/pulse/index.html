<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pulse — It's Tap Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6EC;
    --ink:#151225;
    --accent:#FF6B5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 42%, #2A1B4A 0%, #1B1035 45%, #0A081A 100%);
    font-family:'Space Grotesk', system-ui, sans-serif;
    touch-action:none;
    user-select:none;
  }
  #wrap{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; display:block; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:center;
    padding-top: max(22px, env(safe-area-inset-top));
    pointer-events:none;
  }
  #score{
    color:var(--cream);
    font-weight:700;
    font-size: clamp(38px, 10vw, 58px);
    line-height:1;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    letter-spacing: -0.01em;
  }
  #combo{
    position:absolute;
    top: calc(max(22px, env(safe-area-inset-top)) + 62px);
    left:0; right:0;
    text-align:center;
    color:#FFD37A;
    font-weight:600;
    font-size:16px;
    opacity:0;
    transition: opacity .15s ease;
    pointer-events:none;
  }
  #combo.show{ opacity:1; }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding: 24px;
  }
  .card{
    background: rgba(21,18,37,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 34px 30px 28px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .card h1{
    color:var(--cream);
    font-size: 30px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .card p{
    color: rgba(253,246,236,0.72);
    font-size: 15px;
    line-height:1.5;
    margin: 0 0 22px;
    font-weight: 500;
  }
  .stat-row{
    display:flex; justify-content:center; gap: 34px;
    margin-bottom: 24px;
  }
  .stat{ text-align:center; }
  .stat .num{ color:var(--cream); font-size: 34px; font-weight:700; line-height:1; }
  .stat .lbl{ color: rgba(253,246,236,0.55); font-size:12px; font-weight:600; margin-top: 6px; }
  .btn{
    display:inline-block;
    background: var(--accent);
    color: var(--ink);
    font-family: inherit;
    font-weight:700;
    font-size:17px;
    border:none;
    border-radius: 14px;
    padding: 14px 30px;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,107,91,0.35);
  }
  .btn:active{ transform: translateY(1px); }

  #hint{
    position:absolute; bottom:0; left:0; right:0;
    text-align:center;
    padding-bottom: max(26px, env(safe-area-inset-bottom));
    color: rgba(253,246,236,0.5);
    font-size: 13px;
    font-weight:600;
    pointer-events:none;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud"><div id="score">0</div></div>
  <div id="combo">PERFECT STREAK</div>
  <div id="hint">Tap when the ring lines up · or press Space</div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Pulse</h1>
      <p>A ring grows from the center. Tap the instant it lines up with the target ring.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <h1 id="overTitle">Off beat</h1>
      <div class="stat-row">
        <div class="stat"><div class="num" id="finalScore">0</div><div class="lbl">Hits</div></div>
        <div class="stat"><div class="num" id="bestScore">0</div><div class="lbl">Best</div></div>
      </div>
      <button class="btn" id="retryBtn">Try again</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const overTitle = document.getElementById('overTitle');
  const hint = document.getElementById('hint');

  let W, H, DPR, CX, CY;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H*0.46;
  }
  window.addEventListener('resize', resize);
  resize();

  const RING_COLORS = ['#FF6B5B','#FFB84D','#4EE2A0','#4DC9FF','#8B6BFF','#FF5B9F','#FFD866'];
  function colorForScore(s){ return RING_COLORS[s % RING_COLORS.length]; }

  let state = 'ready';
  let score = 0, best = 0, combo = 0;
  let radius = 0;
  let ringSpeed = 2.3;
  let targetRadius = 0;
  let tolerance = 16;
  let shake = 0;
  let particles = [];
  let flashRing = null; // {r, color, alpha}
  let restartCooldown = 0;

  function maxDim(){ return Math.min(W,H); }

  function newTarget(){
    const m = maxDim();
    targetRadius = m*(0.28 + Math.random()*0.16);
  }

  function resetGame(){
    score = 0; combo = 0; shake = 0;
    ringSpeed = 2.3; tolerance = 16;
    radius = 0;
    particles = [];
    flashRing = null;
    newTarget();
    updateScoreUI();
  }

  function updateScoreUI(){ scoreEl.textContent = score; }

  let comboHideTimer = null;
  function showCombo(){
    if (combo >= 2){
      comboEl.textContent = combo >= 5 ? `PERFECT STREAK ×${combo}` : 'PERFECT!';
      comboEl.classList.add('show');
      clearTimeout(comboHideTimer);
      comboHideTimer = setTimeout(()=>comboEl.classList.remove('show'), 650);
    }
  }

  function spawnBurst(r,color){
    for(let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1.5+Math.random()*3;
      const x = CX + Math.cos(a)*r, y = CY + Math.sin(a)*r;
      particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color});
    }
  }

  function attemptTap(){
    const diff = Math.abs(radius - targetRadius);
    const color = colorForScore(score);
    if (diff <= tolerance){
      score++;
      combo++;
      updateScoreUI();
      spawnBurst(radius, color);
      flashRing = {r:targetRadius, color, alpha:1};
      showCombo();
      shake = Math.min(shake+2.5, 9);
      ringSpeed = Math.min(ringSpeed + 0.14, 7.5);
      tolerance = Math.max(tolerance - 0.55, 6);
      radius = 0;
      newTarget();
    } else {
      fail();
    }
  }

  function fail(){
    state = 'over';
    best = Math.max(best, score);
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    overTitle.textContent = score >= 15 ? 'Locked in' : 'Off beat';
    overScreen.classList.remove('hidden');
    hint.style.opacity = 0;
    restartCooldown = 24;
    shake = 14;
  }

  function startGame(){
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    hint.style.opacity = 1;
    state = 'playing';
    resetGame();
  }

  function onTap(){
    if (state === 'ready'){ startGame(); return; }
    if (state === 'playing'){ attemptTap(); return; }
    if (state === 'over'){
      if (restartCooldown > 0) return;
      startGame();
      return;
    }
  }
  window.addEventListener('pointerdown', onTap);
  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space'){ e.preventDefault(); onTap(); }
  });
  document.getElementById('startBtn').addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  document.getElementById('retryBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(restartCooldown<=0) startGame(); });

  function update(){
    if (restartCooldown>0) restartCooldown--;

    if (state === 'playing'){
      radius += ringSpeed;
      if (radius > targetRadius + tolerance*3 + 40){
        fail();
      }
    }
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= 0.97; p.vy *= 0.97;
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.03;
      if (p.life<=0) particles.splice(i,1);
    }
    if (flashRing){
      flashRing.alpha -= 0.05;
      if (flashRing.alpha<=0) flashRing = null;
    }
    if (shake>0) shake *= 0.85;
    if (shake<0.05) shake = 0;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    ctx.save();
    if (shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // target ring
    ctx.beginPath();
    ctx.arc(CX,CY,targetRadius,0,Math.PI*2);
    ctx.lineWidth = tolerance*2;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CX,CY,targetRadius,0,Math.PI*2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.stroke();

    // flash on hit
    if (flashRing){
      ctx.beginPath();
      ctx.arc(CX,CY,flashRing.r,0,Math.PI*2);
      ctx.lineWidth = 5;
      ctx.globalAlpha = Math.max(flashRing.alpha,0);
      ctx.strokeStyle = flashRing.color;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // growing ring
    if (state === 'playing'){
      ctx.beginPath();
      ctx.arc(CX,CY,radius,0,Math.PI*2);
      ctx.lineWidth = 5;
      ctx.strokeStyle = colorForScore(score);
      ctx.shadowColor = colorForScore(score);
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // center dot
    ctx.beginPath();
    ctx.arc(CX,CY,4,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();

    // particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
