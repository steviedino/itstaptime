<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>It's Tap Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6EC;
    --ink:#151225;
    --accent:#FF6B5B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Space Grotesk', system-ui, sans-serif;
    background: linear-gradient(180deg, #1B1035 0%, #2A1B4A 55%, #0A081A 100%);
    color: var(--cream);
  }
  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  header{
    text-align:center;
    margin-bottom: 56px;
  }
  h1{
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  header p{
    color: rgba(253,246,236,0.6);
    font-size: 17px;
    margin: 0;
    font-weight: 500;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .card{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 26px;
    text-decoration:none;
    color: inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: transform .15s ease, background .15s ease;
  }
  .card:hover{
    background: rgba(255,255,255,0.09);
    transform: translateY(-3px);
  }
  .card .swatch{
    width:100%; height:100px;
    border-radius: 12px;
    margin-bottom: 4px;
  }
  .card h2{
    font-size: 20px;
    margin: 0;
    font-weight: 700;
  }
  .card p{
    margin:0;
    font-size: 14px;
    color: rgba(253,246,236,0.6);
    line-height:1.5;
  }
  .card.empty{
    align-items:center;
    justify-content:center;
    text-align:center;
    border-style: dashed;
    color: rgba(253,246,236,0.35);
    font-size: 14px;
  }
  .skyline-swatch{
    background: linear-gradient(180deg, #FF8B6B 0%, #8B6BFF 100%);
  }

  /* --- Today's game --- */
  .featured{
    display:block;
    text-decoration:none;
    color:inherit;
    border-radius: 24px;
    padding: 40px;
    margin-bottom: 56px;
    background: linear-gradient(135deg, rgba(255,107,91,0.16), rgba(139,107,255,0.16));
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    overflow:hidden;
    transition: transform .15s ease, background .15s ease;
  }
  .featured:hover{
    transform: translateY(-3px);
    background: linear-gradient(135deg, rgba(255,107,91,0.22), rgba(139,107,255,0.22));
  }
  .featured .tag{
    display:inline-block;
    background: var(--accent);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .featured h2{
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 10px;
    font-weight: 700;
  }
  .featured p{
    margin: 0 0 22px;
    color: rgba(253,246,236,0.72);
    font-size: 15px;
    max-width: 440px;
    line-height:1.5;
  }
  .featured .play{
    display:inline-block;
    background: var(--cream);
    color: var(--ink);
    font-weight: 700;
    font-size: 15px;
    padding: 12px 24px;
    border-radius: 12px;
  }
  h3.section-label{
    font-size: 15px;
    font-weight: 600;
    color: rgba(253,246,236,0.5);
    margin: 0 0 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>It's Tap Time</h1>
    <p>One tap. See how far you get.</p>
  </header>
  <!-- TODAY'S GAME — update this block each time you post a new game -->
  <a class="featured" href="/games/skyline/">
    <div class="tag">Today</div>
    <h2>Skyline</h2>
    <p>Stack the blocks as high as you can. Line it up perfectly to keep your streak alive.</p>
    <span class="play">Play now</span>
  </a>

  <h3 class="section-label">Past games</h3>
  <div class="grid">
    <div class="card empty">Yesterday's games will show up here</div>
  </div>
</div>
</body>
</html>
