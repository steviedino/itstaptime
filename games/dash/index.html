<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dash — It's Tap Time</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Dash — It's Tap Time">
<meta property="og:description" content="Tap to jump. Clear the obstacles as the pace keeps climbing.">
<meta property="og:image" content="https://itstaptime.com/assets/og-dash.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dash — It's Tap Time">
<meta name="twitter:description" content="Tap to jump. Clear the obstacles as the pace keeps climbing.">
<meta name="twitter:image" content="https://itstaptime.com/assets/og-dash.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6EC;
    --ink:#151225;
    --accent:#FF6B5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: linear-gradient(180deg, #1B1035 0%, #2A1B4A 60%, #0A081A 100%);
    font-family:'Space Grotesk', system-ui, sans-serif;
    touch-action:none;
    user-select:none;
  }
  #wrap{ position:fixed; inset:0; }
  .home-link{
    touch-action: manipulation;
    position:absolute;
    top: max(20px, env(safe-area-inset-top));
    left: 18px;
    z-index: 20;
    display:flex;
    align-items:center;
    gap:5px;
    color: var(--cream, #FDF6EC);
    text-decoration:none;
    font-family: inherit;
    font-size: 14px;
    font-weight:600;
    background: rgba(255,255,255,0.08);
    padding: 9px 16px 9px 12px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .home-link:active{ background: rgba(255,255,255,0.18); }
  canvas{ position:absolute; inset:0; display:block; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:center;
    padding-top: max(22px, env(safe-area-inset-top));
    pointer-events:none;
  }
  #score{
    color:var(--cream);
    font-weight:700;
    font-size: clamp(38px, 10vw, 58px);
    line-height:1;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    letter-spacing: -0.01em;
  }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding: 24px;
  }
  .card{
    background: rgba(21,18,37,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 34px 30px 28px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .card h1{ color:var(--cream); font-size: 30px; margin: 0 0 6px; font-weight: 700; }
  .card p{ color: rgba(253,246,236,0.72); font-size: 15px; line-height:1.5; margin: 0 0 22px; font-weight: 500; }
  .stat-row{ display:flex; justify-content:center; gap: 34px; margin-bottom: 24px; }
  .stat{ text-align:center; }
  .stat .num{ color:var(--cream); font-size: 34px; font-weight:700; line-height:1; }
  .stat .lbl{ color: rgba(253,246,236,0.55); font-size:12px; font-weight:600; margin-top: 6px; }
  .btn{
    display:inline-block;
    touch-action: manipulation;
    background: var(--accent);
    color: var(--ink);
    font-family: inherit;
    font-weight:700;
    font-size:17px;
    border:none;
    border-radius: 14px;
    padding: 14px 30px;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,107,91,0.35);
  }
  .btn:active{ transform: translateY(1px); }

  #hint{
    position:absolute; bottom:0; left:0; right:0;
    text-align:center;
    padding-bottom: max(26px, env(safe-area-inset-bottom));
    color: rgba(253,246,236,0.5);
    font-size: 13px;
    font-weight:600;
    pointer-events:none;
  }
  .best-line{
    margin: -10px 0 20px;
    font-size: 13px;
    font-weight:600;
    color: rgba(253,246,236,0.5);
  }
  .new-best{
    display:inline-block;
    background: var(--accent);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin: -8px 0 18px;
  }
  .challenge-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: var(--accent);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    margin: 4px 0 16px;
  }
  .btn-row{ display:flex; gap:10px; justify-content:center; }
  .btn.secondary{
    background: rgba(255,255,255,0.1);
    color: var(--cream);
    box-shadow:none;
  }
  #toast{
    position:absolute;
    bottom: max(76px, calc(env(safe-area-inset-bottom) + 64px));
    left:50%; transform:translateX(-50%);
    background: rgba(21,18,37,0.94);
    color:var(--cream);
    padding:10px 18px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
    z-index: 30;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <a class="home-link" href="/" id="homeLink">&larr; Home</a>
  <div id="hud"><div id="score">0</div></div>
  <div id="hint">Tap to jump · or press Space</div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Dash</h1>
      <p class="challenge-tag hidden" id="challengeLine">🎯 Beat <span id="challengeVal">0</span> to win</p>
      <p>Tap to jump. Clear the obstacles, don't clip one.</p>
      <p class="best-line hidden" id="bestLine">Best: <span id="bestLineVal">0</span></p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <h1 id="overTitle">Wiped out</h1>
      <div class="new-best hidden" id="newBestTag">New best!</div>
      <div class="new-best hidden" id="challengeBeatTag">🏆 You beat the challenge!</div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="finalScore">0</div><div class="lbl">Distance</div></div>
        <div class="stat"><div class="num" id="bestScore">0</div><div class="lbl">Best</div></div>
      </div>
      <div class="btn-row"><button class="btn" id="retryBtn">Try again</button><button class="btn secondary" id="shareBtn">Share score</button></div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="/assets/tap-time.js"></script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const overTitle = document.getElementById('overTitle');
  const bestLine = document.getElementById('bestLine');
  const bestLineVal = document.getElementById('bestLineVal');
  const newBestTag = document.getElementById('newBestTag');
  const challengeLine = document.getElementById('challengeLine');
  const challengeVal = document.getElementById('challengeVal');
  const challengeBeatTag = document.getElementById('challengeBeatTag');
  const shareBtn = document.getElementById('shareBtn');
  const toastEl = document.getElementById('toast');
  const hint = document.getElementById('hint');

  let W, H, DPR, groundY;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    groundY = H*0.72;
  }
  window.addEventListener('resize', resize);
  resize();

  const OBSTACLE_COLORS = ['#FF6B5B','#FFB84D','#4EE2A0','#4DC9FF','#8B6BFF','#FF5B9F','#FFD866'];

  let state = 'ready';
  let score = 0, best = TapTime.getBest('dash');
  if (best > 0){
    bestLineVal.textContent = best;
    bestLine.classList.remove('hidden');
  }
  const challengeScore = window.TapTime ? TapTime.getChallenge() : null;
  if (challengeScore != null){
    challengeVal.textContent = challengeScore;
    challengeLine.classList.remove('hidden');
  }
  let player, obstacles = [], particles = [], stars;
  let speed = 4.0;
  let gravity = 0.85;
  let jumpV = -15.5;
  let dist = 0;
  let shake = 0;
  let restartCooldown = 0;
  let nextSpawnDist = 0;

  const PLAYER_SIZE = 34;
  const JUMP_AIRTIME = 2*Math.abs(jumpV)/gravity; // frames spent airborne on a full jump

  function resetGame(){
    score = 0; dist = 0; speed = 4.0; shake = 0;
    player = { x: W*0.2, y: groundY-PLAYER_SIZE, vy:0, onGround:true, tilt:0 };
    obstacles = [];
    particles = [];
    nextSpawnDist = 0;
    scheduleNext();
    updateScoreUI();
    if (!stars){
      stars = [];
      for(let i=0;i<60;i++){
        stars.push({x:Math.random()*W, y:Math.random()*H*0.6, r:Math.random()*1.6+0.4, tw:Math.random()*Math.PI*2});
      }
    }
  }

  function updateScoreUI(){ scoreEl.textContent = score; }

  function scheduleNext(){
    // guarantee enough room to land before the next obstacle arrives,
    // no matter how fast the ground is currently scrolling
    const safeGap = speed*JUMP_AIRTIME*1.08 + 46;
    nextSpawnDist = dist + safeGap + Math.random()*(70 + speed*4);
  }

  function spawnObstacle(){
    const difficultyT = Math.min(score/25, 1);
    const isTall = Math.random() < 0.4;
    const h = isTall ? (44 + difficultyT*22 + Math.random()*16) : (24 + difficultyT*12 + Math.random()*10);
    const w = 20 + Math.random()*12;
    const color = OBSTACLE_COLORS[obstacles.length % OBSTACLE_COLORS.length];
    obstacles.push({ x: W+40, y: groundY-h, w, h, color, passed:false });
  }

  function jump(){
    if (player.onGround){
      player.vy = jumpV;
      player.onGround = false;
      spawnDust(player.x+PLAYER_SIZE/2, groundY, 8);
      if (window.TapTime){ TapTime.sfx.tap(); TapTime.haptics.tap(); }
    }
  }

  function spawnDust(x,y,n){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*2.5,
        vy:-Math.random()*2-0.5,
        life:1,
        color:'rgba(253,246,236,0.7)'
      });
    }
  }

  function fail(){
    state = 'over';
    if (window.TapTime){ TapTime.sfx.fail(); TapTime.haptics.fail(); }
    const result = TapTime.setBestIfHigher('dash', score);
    best = result.value;
    newBestTag.classList.toggle('hidden', !(result.isNew && score > 0));
    challengeBeatTag.classList.toggle('hidden', !(challengeScore != null && score > challengeScore));
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    overTitle.textContent = score >= 40 ? 'Full sprint' : 'Wiped out';
    overScreen.classList.remove('hidden');
    hint.style.opacity = 0;
    restartCooldown = 24;
    shake = 14;
  }

  function startGame(){
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    hint.style.opacity = 1;
    state = 'playing';
    if (window.TapTime) TapTime.recordPlay();
    resetGame();
  }

  function onTap(){
    if (state === 'ready'){ startGame(); return; }
    if (state === 'playing'){ jump(); return; }
    if (state === 'over'){
      if (restartCooldown > 0) return;
      startGame();
      return;
    }
  }
  window.addEventListener('pointerdown', onTap);
  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space'){ e.preventDefault(); onTap(); }
  });
  document.getElementById('startBtn').addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  document.getElementById('homeLink').addEventListener('pointerdown', (e)=>{ e.stopPropagation(); });
  document.getElementById('retryBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(restartCooldown<=0) startGame(); });
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }
  shareBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); });
  shareBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if (!window.TapTime) return;
    const method = TapTime.share('Dash', score);
    if (method === 'clipboard') showToast('Copied to clipboard!');
    else if (method === 'none') showToast("Couldn't share on this browser");
  });

  function update(){
    if (restartCooldown>0) restartCooldown--;

    if (state === 'playing'){
      dist += speed;
      speed = Math.min(4.0 + Math.max(dist-420, 0)*0.0011, 10.5);

      player.vy += gravity;
      player.y += player.vy;
      if (player.y >= groundY-PLAYER_SIZE){
        if (!player.onGround) spawnDust(player.x+PLAYER_SIZE/2, groundY, 6);
        player.y = groundY-PLAYER_SIZE;
        player.vy = 0;
        player.onGround = true;
      }
      player.tilt = Math.max(-0.5, Math.min(0.5, player.vy*0.03));

      if (dist >= nextSpawnDist){
        spawnObstacle();
        scheduleNext();
      }

      for (let i=obstacles.length-1;i>=0;i--){
        const o = obstacles[i];
        o.x -= speed;
        if (!o.passed && o.x+o.w < player.x){
          o.passed = true;
          score++;
          updateScoreUI();
        }
        if (o.x < -60) obstacles.splice(i,1);

        // collision (slightly inset for fairness)
        const px = player.x+9, py = player.y+9, pw = PLAYER_SIZE-18, ph = PLAYER_SIZE-18;
        if (px < o.x+o.w && px+pw > o.x && py < o.y+o.h && py+ph > o.y){
          fail();
        }
      }
    }

    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.1;
      p.life -= 0.04;
      if (p.life<=0) particles.splice(i,1);
    }
    if (shake>0) shake *= 0.85;
    if (shake<0.05) shake = 0;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // stars
    if (stars){
      for (const s of stars){
        s.tw += 0.03;
        ctx.globalAlpha = 0.3 + Math.sin(s.tw)*0.25;
        ctx.fillStyle = '#FDF6EC';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ground
    ctx.strokeStyle = 'rgba(253,246,236,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY+PLAYER_SIZE);
    ctx.lineTo(W, groundY+PLAYER_SIZE);
    ctx.stroke();

    // obstacles
    for (const o of obstacles){
      ctx.fillStyle = o.color;
      roundRect(o.x, o.y, o.w, o.h, 6);
      ctx.fill();
    }

    // player
    if (player){
      ctx.save();
      ctx.translate(player.x+PLAYER_SIZE/2, player.y+PLAYER_SIZE/2);
      ctx.rotate(player.tilt);
      ctx.fillStyle = '#FF6B5B';
      roundRect(-PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE, 9);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      roundRect(-PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE*0.4, 9);
      ctx.fill();
      ctx.restore();
    }

    // dust particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
